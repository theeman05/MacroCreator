name: Build EXE

on:
  release:
    types: [published]

  push:
    branches:
      - debug-build

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          
      - name: Install Dependencies
        run: |
          pip install .
          pip install pyinstaller
          
      - name: Build EXE
        run: pyinstaller MacroStudio.spec

      - name: Zip Build Folder
        run: |
          Compress-Archive -Path dist/MacroStudio/* -DestinationPath dist/MacroStudio-Win64.zip
        shell: pwsh

      - name: Upload Zip to Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist/MacroStudio-Win64.zip
          asset_name: MacroStudio-Win64.zip
          tag: v1.0.4-beta # ${{ github.ref }}
          overwrite: true